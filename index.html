<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bts music</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<div class="toast" id="toast">
    <span id="toastMessage"></span>
</div>
<body>
    <header class="header">
        <button class="account_btn" id="accountBtn">
            <img src="./images/header/logo_acc.png" alt="Логотип аккаунта" class="header_logo">
        </button>
        <nav class="header_nav">
            <ul class="header_list">
                <li><a href="#home_main">Home</a></li>
                <li><a href="#albums_main">Albums</a></li>
                <li><a href="#songs_section">Songs</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <div class="container">
            <section id="home_main" class="home_main">
                <button class="btn_home btn_home_rm" data-member="rm">
                        <img src="./images/home/rm_home.png" alt="кнопка rm">
                </button>
                <button class="btn_home btn_home_jin" data-member="jin">
                        <img src="./images/home/jin_home.png" alt="кнопка jin">
                </button>
                <button class="btn_home btn_home_suga" data-member="suga">
                        <img src="./images/home/suga_home.png" alt="кнопка suga">
                </button>
                <button class="btn_home btn_home_jhope" data-member="jhope">
                        <img src="./images/home/jhope_home.png" alt="кнопка jhope">
                </button>
                <button class="btn_home btn_home_jimin" data-member="jimin">
                        <img src="./images/home/jimin_home.png" alt="кнопка jimin">
                </button>
                <button class="btn_home btn_home_v" data-member="v">
                        <img src="./images/home/v_home.png" alt="кнопка v">
                </button>
                <button class="btn_home btn_home_jk" data-member="jk">
                        <img src="./images/home/jk_home.png" alt="кнопка jk">
                </button>
                <button class="btn_home btn_home_bts" data-member="bts">
                        <img src="./images/home/bts_home.png" alt="кнопка bts">
                </button>
            </section>

            <section id="albums_main" class="albums_main">
                <div class="carousel-container">
                    <button class="carousel-btn prev">
                        <img src="./images/albums/left_move.png" alt="Влево">
                    </button>
                    <div class="carousel-slide" id="carousel"></div>
                    <button class="carousel-btn next">
                        <img src="./images/albums/right_move.png" alt="Вправо">
                    </button>
                </div>
            </section>

            <section id="songs_section" class="songs-section">
                <h2 id="songsAlbumTitle" class="songs-album-title"></h2>
                <div class="songs-tracklist" id="songsTracklist"></div>
            </section>
        </div>
    </main>

    <div class="player-bar" id="playerBar">
        <div class="player-content">
            <!-- Название трека -->
            <span id="playerTrackTitle" class="player-track-name">Название трека</span>
            
            <!-- Кнопки управления -->
            <div class="player-controls">
                <!-- Лайк -->
                <button id="playerLikeBtn" class="player-like-btn">
                    <img id="playerLikeIcon" src="./images/player/like_empty_player.png" alt="Like">
                </button>
                
                <!-- Назад -->
                <button id="prevTrack" class="player-ctrl-btn">
                    <img src="./images/player/prev.png" alt="Назад">
                </button>
                
                <!-- Play/Pause -->
                <button id="playPauseBtn" class="player-ctrl-btn player-play-main">
                    <img id="playPauseIcon" src="./images/player/play.png" alt="Play">
                </button>
                
                <!-- Вперёд -->
                <button id="nextTrack" class="player-ctrl-btn">
                    <img src="./images/player/next.png" alt="Вперёд">
                </button>
                
                <!-- Repeat -->
                <button id="repeatBtn" class="player-repeat-btn" title="Играть подряд">
                    <img id="repeatIcon" src="./images/player/repeat_all.png" alt="Repeat">
                </button>
            </div>
        </div>
    
    <!-- Прогресс-бар -->
        <div class="player-progress-wrapper">
            <span class="player-time" id="currentTime">0:00</span>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="player-time" id="durationTime">0:00</span>
        </div>
        
        <audio id="audioPlayer" preload="auto"></audio>
    </div>
    <!-- Модалка "Добавить в плейлист" -->
    <div class="playlist-modal-overlay" id="playlistModal">
        <div class="playlist-modal">
            <h3>Добавить в плейлист</h3>
            <div class="playlist-list" id="playlistList"></div>
            <div class="playlist-create">
                <input type="text" id="newPlaylistName" placeholder="Название нового плейлиста">
                <button id="createPlaylistBtn">Создать</button>
            </div>
        </div>
    </div>
    <div class="account-dropdown" id="accountDropdown">
        <div class="account-top">
            <div class="account-profile">
                <img src="./images/header/logo_acc.png" alt="Аватар" class="account-avatar">
                <span class="account-username">@user_name</span>
            </div>
            <button class="account-settings-btn" data-page="settings">
                <img src="./images/header/settings.png" alt="Настройки">
            </button>
        </div>
        <div class="account-divider"></div>
        <nav class="account-menu">
            <button class="account-menu-item" data-page="favourites">Избранное</button>
            <button class="account-menu-item" data-page="playlists">Плейлисты</button>
            <button class="account-menu-item" data-page="awards">Награды</button>
            <button class="account-menu-item" data-page="tests">Тесты</button>
        </nav>
    </div>
    <script src="./js/albums_data.js"></script>
    <script src="./js/songs_data.js"></script>
    <script src="./js/render.js"></script>
    <script src="./js/slider.js"></script>
    <script src="./js/player.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/account.js"></script>
</body>
</html>
