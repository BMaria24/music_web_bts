<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bts music</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="header">
        <button class="account_btn" id="accountBtn">
            <img src="./images/header/logo_acc.png" alt="Логотип аккаунта" class="header_logo">
        </button>
        <nav class="header_nav">
            <ul class="header_list">
                <li><a href="#home_main">Home</a></li>
                <li><a href="#albums_main">Albums</a></li>
                <li><a href="#!">Songs</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <div class="container">
            <section id="home_main" class="home_main">
                <button class="btn_home btn_home_rm" data-member="rm">
                        <img src="./images/home/rm_home.png" alt="кнопка rm">
                </button>
                <button class="btn_home btn_home_jin" data-member="jin">
                        <img src="./images/home/jin_home.png" alt="кнопка jin">
                </button>
                <button class="btn_home btn_home_suga" data-member="suga">
                        <img src="./images/home/suga_home.png" alt="кнопка suga">
                </button>
                <button class="btn_home btn_home_jhope" data-member="jhope">
                        <img src="./images/home/jhope_home.png" alt="кнопка jhope">
                </button>
                <button class="btn_home btn_home_jimin" data-member="jimin">
                        <img src="./images/home/jimin_home.png" alt="кнопка jimin">
                </button>
                <button class="btn_home btn_home_v" data-member="v">
                        <img src="./images/home/v_home.png" alt="кнопка v">
                </button>
                <button class="btn_home btn_home_jk" data-member="jk">
                        <img src="./images/home/jk_home.png" alt="кнопка jk">
                </button>
                <button class="btn_home btn_home_bts" data-member="bts">
                        <img src="./images/home/bts_home.png" alt="кнопка bts">
                </button>
            </section>

            <section id="albums_main" class="albums_main">
                <div class="carousel-container">
                    <button class="carousel-btn prev">
                        <img src="./images/albums/left_move.png" alt="Влево">
                    </button>
                    <div class="carousel-slide" id="carousel"></div>
                    <button class="carousel-btn next">
                        <img src="./images/albums/right_move.png" alt="Вправо">
                    </button>
                </div>
            </section>
        </div>
    </main>
    <script src="./js/albums_data.js"></script>
    <script src="./js/render.js"></script>
    <script src="./js/slider.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
